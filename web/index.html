<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LARP COIN</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.app{max-width:520px;margin:auto;padding:18px 16px 28px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.title{font-size:25px;font-weight:900;color:#fff;text-shadow:0 0 12px #f00}.small{color:#aaa;font-size:13px}.card{background:#0b0b0b;border:1px solid #2a2a2a;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 8px 30px #000}.balance{text-align:center;font-size:40px;font-weight:900;margin:5px 0;color:#fff}.label{text-align:center;color:#aaa}.coin-wrap{display:flex;justify-content:center;align-items:center;height:300px}.coin{width:225px;height:225px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;transition:.08s;filter:drop-shadow(0 0 30px #f006);overflow:hidden}.coin img{width:100%;height:100%;object-fit:cover;border-radius:50%}.coin:active{transform:scale(.92)}.energy{height:14px;background:#181818;border:1px solid #2d2d2d;border-radius:10px;overflow:hidden;margin-top:10px}.energy>div{height:100%;background:linear-gradient(90deg,#8b0000,#f11);transition:.15s}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:1px solid #333;border-radius:14px;padding:14px;background:#111;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}button.primary{background:#d90000;color:#fff;border-color:#f22;box-shadow:0 0 14px #f004}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.panel{display:none}.panel.active{display:block}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #242424}.float{position:fixed;pointer-events:none;font-weight:900;font-size:23px;color:#f22;animation:up .65s forwards;z-index:30}.music-btn{padding:9px 11px!important;border-radius:12px!important;font-size:18px!important;background:#0d0d0d!important;border:1px solid #333!important;color:#fff!important;min-width:42px;touch-action:manipulation;position:relative;z-index:100}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-grid input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;font-size:15px}.admin-grid button{grid-column:1/-1}.notice{padding:10px 12px;border-radius:12px;background:#0d0d0d;color:#aaa;font-size:13px;margin-top:10px;border:1px solid #242424}#easter{display:none;position:fixed;inset:0;z-index:50;background:#000;align-items:center;justify-content:center}#easter.show{display:flex}#easter img{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain}.glitch{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 5px,#f002 6px 7px)}body.evil{background:#000!important;color:#f11!important}body.evil .card,body.evil button{background:#050505;border-color:#f11;color:#fff}body.evil .title,body.evil .balance{color:#f11}@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
</style></head><body><div class="app"><header class="header"><div><div class="title">🔴 LARP COIN</div><div class="small" id="name">Загрузка...</div></div><div style="display:flex;align-items:center;gap:8px"><button id="musicBtn" type="button" class="music-btn">🔇</button><div class="small" id="myId"></div></div></header>
<section id="game" class="panel active"><div class="card"><div class="balance" id="coins">0</div><div class="label">🪙 монет</div><div class="coin-wrap"><div class="coin" id="coin"><img src="/static/coin.png" alt="coin"></div></div><div class="item"><span>⚡ Энергия</span><b><span id="energy">0</span> / <span id="maxEnergy">0</span></b></div><div class="energy"><div id="energyBar"></div></div></div><div class="card"><div class="buttons"><button class="primary" id="tapUpgrade">⚡ Улучшить клик</button><button class="primary" id="energyUpgrade">🔋 Улучшить энергию</button></div></div></section>
<section id="top" class="panel"><div class="card"><h2>🏆 Топ игроков</h2><div id="leaderboard"></div></div></section><section id="ref" class="panel"><div class="card"><h2>👥 Рефералы</h2><p>Приглашай друзей и получай бонусы в LARP COIN.</p><div class="item"><span>Твои рефералы</span><b id="refs">0</b></div><button class="primary" id="share">📤 Пригласить друга</button></div></section>
<section id="admin" class="panel"><div class="card"><h2>🛠 Админка</h2><div class="small">Выдача и списание коинов по Telegram ID.</div><div class="admin-grid" style="margin-top:12px"><input id="targetId" inputmode="numeric" placeholder="Telegram ID"><input id="grantAmount" inputmode="numeric" placeholder="Количество"><button class="primary" id="grantBtn">💰 Выдать коины</button><button id="withdrawBtn">➖ Забрать коины</button></div><div id="grantResult" class="notice">Только для администратора.</div></div></section>
<div class="nav"><button onclick="showPanel('game')">🪙 Игра</button><button onclick="showPanel('top');loadTop()">🏆 Топ</button><button onclick="showPanel('ref')">👥 Рефы</button><button id="adminNav" style="display:none" onclick="showPanel('admin')">🛠 Админ</button></div></div>
<audio id="bgMusic" loop preload="auto" playsinline><source src="/static/music.m4a" type="audio/mp4"></audio><div id="easter"><img src="/static/coin.png" alt=""><div class="glitch"></div></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const initData=tg.initData;let state=null,evilTimer=null;const EASTER=[333,3333,33333,333333],$=id=>document.getElementById(id);
function render(s){const old=state?.coins;state=s;$('name').textContent=s.name;$('myId').textContent='ID: '+s.id;$('coins').textContent=Number(s.coins).toLocaleString('ru-RU');$('energy').textContent=s.energy;$('maxEnergy').textContent=s.max_energy;$('refs').textContent=s.referrals;$('energyBar').style.width=Math.max(0,Math.min(100,s.energy/s.max_energy*100))+'%';$('tapUpgrade').textContent=`⚡ +1 к клику (${100*s.tap_power*s.tap_power} 🪙)`;$('energyUpgrade').textContent=`🔋 +250 энергии (${150*s.energy_level*s.energy_level} 🪙)`;if(s.is_admin)$('adminNav').style.display='block';if(old!==s.coins&&EASTER.includes(Number(s.coins)))triggerEaster()}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({detail:'Ошибка сервера'}));if(!r.ok)throw Error(d.detail||'Ошибка');return d}
function triggerEaster(){clearTimeout(evilTimer);document.body.classList.add('evil');$('easter').classList.add('show');evilTimer=setTimeout(()=>{$('easter').classList.remove('show');document.body.classList.remove('evil')},5000)}
const tapQueue=[];let tapFlushTimer=null,tapSending=false;
function addOptimisticCoins(n){if(!state)return 0;const a=Math.min(n,state.energy);if(a<=0)return 0;state.energy-=a;state.coins+=a*state.tap_power;state.best_coins=Math.max(state.best_coins||0,state.coins);$('coins').textContent=Number(state.coins).toLocaleString('ru-RU');$('energy').textContent=state.energy;$('energyBar').style.width=Math.max(0,Math.min(100,state.energy/state.max_energy*100))+'%';if(EASTER.includes(Number(state.coins)))triggerEaster();return a}
function queueTap(n){if(!state)return;const a=addOptimisticCoins(n);if(!a)return;tapQueue.push(a);const f=document.createElement('div');f.className='float';f.textContent='+'+(a*state.tap_power)+' 🪙';f.style.left=(innerWidth/2-45)+'px';f.style.top=(innerHeight/2-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),700);if(!tapFlushTimer)tapFlushTimer=setTimeout(flushTaps,60)}
async function flushTaps(){tapFlushTimer=null;if(tapSending||!tapQueue.length)return;tapSending=true;try{while(tapQueue.length){const total=Math.min(20,tapQueue.reduce((a,b)=>a+b,0));let left=total;while(left>0){const part=Math.min(20,left);await api('/api/tap',{init_data:initData,taps:part});left-=part;let consumed=part;while(consumed>0&&tapQueue.length){const take=Math.min(consumed,tapQueue[0]);tapQueue[0]-=take;consumed-=take;if(tapQueue[0]<=0)tapQueue.shift()}}}}catch(e){try{const s=await api('/api/state',{init_data:initData});render(s)}catch(_){}}finally{tapSending=false;if(tapQueue.length)flushTaps()}}
$('coin').addEventListener('pointerdown',e=>{e.preventDefault();queueTap(1)});
$('tapUpgrade').onclick=async()=>{try{render(await api('/api/upgrade',{init_data:initData,kind:'tap'}))}catch(e){tg.showAlert(e.message)}};$('energyUpgrade').onclick=async()=>{try{render(await api('/api/upgrade',{init_data:initData,kind:'energy'}))}catch(e){tg.showAlert(e.message)}};
async function loadTop(){try{const d=await fetch('/api/leaderboard').then(r=>r.json());$('leaderboard').innerHTML=d.map(x=>`<div class="item"><span>${escapeHtml(x.name)}</span><b>${Number(x.coins).toLocaleString('ru-RU')} 🪙</b></div>`).join('')}catch(e){$('leaderboard').textContent='Ошибка загрузки топа'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function showPanel(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
$('share').onclick=()=>{if(!state)return;const botLink=`https://t.me/larpcoin333bot?start=ref_${state.id}`;tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botLink)}&text=${encodeURIComponent('🔴 Заходи в LARP COIN и получи бонус!')}`)};
async function adminAction(path,success){const target=Number($('targetId').value),amount=Number($('grantAmount').value);if(!Number.isInteger(target)||target<=0||!Number.isInteger(amount)||amount<=0){$('grantResult').textContent='Введи корректный ID и положительное количество коинов.';return}try{const s=await api(path,{init_data:initData,target_id:target,amount});$('grantResult').textContent=`${success} ${amount.toLocaleString('ru-RU')} 🪙. Сейчас: ${Number(s.coins).toLocaleString('ru-RU')} 🪙.`}catch(e){$('grantResult').textContent='Ошибка: '+e.message}}
$('grantBtn').onclick=()=>adminAction('/api/admin/grant','Выдано');$('withdrawBtn').onclick=()=>adminAction('/api/admin/withdraw','Забрано');
setInterval(async()=>{if(!state||tapSending||tapQueue.length)return;try{const s=await api('/api/state',{init_data:initData});if(Number(s.coins)>=Number(state.coins))render(s);else{$('energy').textContent=s.energy;$('energyBar').style.width=Math.max(0,Math.min(100,s.energy/s.max_energy*100))+'%';state.energy=s.energy}}catch(e){}},2000);
const bgMusic=$('bgMusic'),musicBtn=$('musicBtn');let musicOn=false;bgMusic.volume=.35;function setMusic(on){musicOn=on;musicBtn.textContent=on?'🔊':'🔇'}async function startMusic(){try{await bgMusic.play();setMusic(true)}catch(e){setMusic(false)}}function stopMusic(){bgMusic.pause();setMusic(false)}musicBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();musicOn?stopMusic():startMusic()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&musicOn)bgMusic.play().catch(()=>{})});
async function init(){if(!initData){document.body.innerHTML='<div style="padding:30px;color:white;font-family:Arial">Открой игру через Telegram.</div>';return}try{const p=new URLSearchParams(location.search);const start=p.get('ref')||p.get('tgWebAppStartParam')||tg.initDataUnsafe?.start_param||null;render(await api('/api/init',{init_data:initData,start_param:start}))}catch(e){tg.showAlert(e.message)}}init();
</script></body></html>
